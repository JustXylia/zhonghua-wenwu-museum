<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>纹饰图鉴 · 中华文物数字馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --color-primary: #c9a962;
    --color-primary-dark: #8b7355;
    --color-primary-light: #e8d08a;
    --color-bg-dark: #0a0908;
    --color-bg-medium: #14110d;
    --color-bg-card: #1c1812;
    --glass-bg: rgba(28, 24, 18, 0.78);
    --glass-border: rgba(201, 169, 98, 0.22);
    --color-text: #f5efe0;
    --color-text-muted: #8a8578;
    --color-success: #6fc18b;
    --font-display: 'Ma Shan Zheng', 'Noto Serif SC', cursive, serif;
    --font-serif: 'Noto Serif SC', serif;
    --font-sans: 'Noto Sans SC', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; }
body {
    font-family: var(--font-sans);
    background: var(--color-bg-dark);
    color: var(--color-text);
    overflow-x: hidden;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ============ 左上角返回按钮 ============ */
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.85rem 1.4rem 0.85rem 1.1rem;
    color: var(--color-bg-dark);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    background: linear-gradient(135deg, #f0d488 0%, #d4b46a 50%, #b89548 100%);
    border: 2px solid #e8c878;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(201,169,98,0.55), 0 0 28px rgba(201,169,98,0.3), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
}
.back-btn svg { width: 20px; height: 20px; stroke-width: 2.5; }
.back-btn:hover {
    transform: translateX(-3px);
    box-shadow: 0 6px 24px rgba(201,169,98,0.7), 0 0 36px rgba(201,169,98,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
}
.back-btn:active { transform: translateX(-1px) scale(0.98); }
@media (max-width: 720px) {
    .back-btn { top: 14px; left: 14px; padding: 0.7rem 1.1rem 0.7rem 0.9rem; font-size: 0.88rem; }
    .back-btn svg { width: 17px; height: 17px; }
}

/* ============ 主舞台 ============ */
.stage {
    position: relative;
    min-height: 100vh;
    padding: 90px 24px 48px;
    background:
        radial-gradient(ellipse at 50% 0%, #2a1f10 0%, #14110d 45%, #0a0908 100%);
    overflow: hidden;
}
.stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(201,169,98,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,169,98,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
}
.stage::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(201,169,98,0.07), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(201,169,98,0.05), transparent 50%);
    pointer-events: none;
    z-index: 0;
}
.container {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
}

/* ============ 顶部标题 ============ */
.page-head { text-align: center; margin-bottom: 36px; }
.page-head .crumb {
    display: inline-block;
    padding: 4px 14px;
    font-size: 0.78rem;
    letter-spacing: 0.3em;
    color: var(--color-primary);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    background: rgba(201,169,98,0.06);
    margin-bottom: 14px;
}
.page-head h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4.5vw, 3rem);
    color: var(--color-primary);
    letter-spacing: 0.18em;
    text-shadow: 0 0 32px rgba(201,169,98,0.35);
    margin-bottom: 10px;
}
.page-head p {
    color: var(--color-text-muted);
    font-size: 0.95rem;
    letter-spacing: 0.2em;
}

/* ============ 主网格 ============ */
.main-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 28px;
    align-items: stretch;
}
@media (max-width: 980px) {
    .main-grid { grid-template-columns: 1fr; }
}

/* ============ 卡片通用 ============ */
.card {
    background: var(--glass-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}
.card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--glass-border);
}
.card-head h2 {
    font-family: var(--font-serif);
    font-size: 1.2rem;
    color: var(--color-text);
    letter-spacing: 0.1em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.card-head h2::before {
    content: '';
    width: 4px;
    height: 18px;
    background: linear-gradient(to bottom, #e8c878, #b89548);
    border-radius: 2px;
}
.card-head .status-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--color-primary);
}
.card-head .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--color-success);
    box-shadow: 0 0 10px var(--color-success);
    animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
}

/* ============ 纹饰展示区 ============ */
.preview-box {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #1a140a 0%, #0a0908 100%);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
}
.preview-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(201,169,98,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,169,98,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
}
.frame-corner {
    position: absolute;
    width: 38px; height: 38px;
    border: 2px solid var(--color-primary);
    z-index: 4;
}
.frame-corner.tl { top: 18px; left: 18px; border-right: none; border-bottom: none; }
.frame-corner.tr { top: 18px; right: 18px; border-left: none; border-bottom: none; }
.frame-corner.bl { bottom: 18px; left: 18px; border-right: none; border-top: none; }
.frame-corner.br { bottom: 18px; right: 18px; border-left: none; border-top: none; }

.preview-art {
    position: relative;
    z-index: 3;
    width: 65%;
    max-width: 360px;
    aspect-ratio: 4 / 5;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 20px rgba(201,169,98,0.35));
    animation: floatY 4s ease-in-out infinite;
}
@keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
.preview-art img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.preview-meta {
    position: absolute;
    left: 0; right: 0;
    bottom: 18px;
    z-index: 5;
    padding: 0 24px;
    text-align: center;
}
.preview-meta .name {
    font-family: var(--font-display);
    color: var(--color-primary);
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(201,169,98,0.5);
}
.preview-meta .sub {
    font-size: 0.78rem;
    color: var(--color-text-muted);
    letter-spacing: 0.2em;
}

.preview-hint {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--color-text-muted);
    padding: 24px;
}
.preview-hint .hint-icon {
    width: 64px; height: 64px;
    margin: 0 auto 14px;
    border: 1.5px solid var(--glass-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(201,169,98,0.05);
}
.preview-hint .hint-icon svg {
    width: 28px; height: 28px;
    stroke: var(--color-primary);
    fill: none;
    stroke-width: 1.5;
}
.preview-hint strong {
    display: block;
    color: var(--color-text);
    font-family: var(--font-display);
    font-size: 1.4rem;
    letter-spacing: 0.2em;
    margin-bottom: 6px;
}
.preview-hint p { font-size: 0.85rem; }

/* ============ 操作按钮 ============ */
.actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
}
.btn {
    flex: 1;
    min-width: 140px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.85rem 1.4rem;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    border-radius: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    border: 1px solid transparent;
}
.btn svg { width: 16px; height: 16px; }
.btn-primary {
    background: linear-gradient(135deg, #e8c878, #b89548);
    color: var(--color-bg-dark);
    box-shadow: 0 6px 18px rgba(201,169,98,0.35);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(201,169,98,0.5);
}
.btn-ghost {
    background: rgba(201,169,98,0.06);
    color: var(--color-primary);
    border-color: var(--glass-border);
}
.btn-ghost:hover {
    background: rgba(201,169,98,0.15);
    border-color: var(--color-primary);
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============ 侧栏 ============ */
.side { display: flex; flex-direction: column; gap: 22px; }
.panel h3 {
    font-family: var(--font-serif);
    font-size: 1.05rem;
    color: var(--color-text);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--glass-border);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.panel h3::before {
    content: '';
    width: 3px; height: 16px;
    background: linear-gradient(to bottom, #e8c878, #b89548);
    border-radius: 2px;
}
.panel p.tip {
    font-size: 0.85rem;
    color: var(--color-text-muted);
    line-height: 1.7;
    margin-bottom: 14px;
}

/* 纹饰选择 chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
    padding: 8px 14px;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--color-text);
    background: rgba(201,169,98,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    transition: all 0.25s ease;
    cursor: pointer;
}
.chip:hover {
    background: rgba(201,169,98,0.18);
    border-color: var(--color-primary);
    color: var(--color-primary-light);
    transform: translateY(-1px);
}
.chip.active {
    background: linear-gradient(135deg, #e8c878, #b89548);
    color: var(--color-bg-dark);
    border-color: var(--color-primary);
    font-weight: 600;
}

/* 详情卡 */
.detail {
    display: none;
    border: 1px solid var(--color-primary);
    background: linear-gradient(135deg, rgba(201,169,98,0.08), rgba(201,169,98,0.02));
    box-shadow: 0 0 32px rgba(201,169,98,0.18);
}
.detail.show { display: block; }
.detail-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--glass-border);
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 4px 10px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #0a3d1c;
    background: linear-gradient(135deg, #b8e8c4, #6fc18b);
    border-radius: 6px;
    letter-spacing: 0.1em;
}
.conf {
    font-size: 0.78rem;
    color: var(--color-text-muted);
    letter-spacing: 0.1em;
}
.conf strong {
    color: var(--color-primary);
    font-size: 1rem;
    margin-left: 4px;
}
.detail-body {
    display: flex;
    gap: 18px;
    align-items: stretch;
}
@media (max-width: 600px) {
    .detail-body { flex-direction: column; }
}
.detail-art {
    position: relative;
    width: 130px; height: 160px;
    flex-shrink: 0;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
}
.detail-art img {
    max-width: 90%; max-height: 90%;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(201,169,98,0.3));
    animation: floatRotate 6s ease-in-out infinite;
}
@keyframes floatRotate {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
}
.detail-art::before, .detail-art::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border: 1.5px solid var(--color-primary);
}
.detail-art::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
.detail-art::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }

.detail-info { flex: 1; min-width: 0; }
.detail-info h4 {
    font-family: var(--font-display);
    color: var(--color-primary);
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
}
.detail-info .sub {
    font-size: 0.85rem;
    color: var(--color-text-muted);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
}
.spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    font-size: 0.82rem;
    margin-bottom: 14px;
}
.spec-grid div span:first-child {
    color: var(--color-text-muted);
    margin-right: 4px;
}
.spec-grid div span:last-child {
    color: var(--color-text);
    font-weight: 500;
}
.detail-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.btn-mini {
    flex: 1;
    min-width: 0;
    padding: 0.6rem 0.8rem;
    font-size: 0.78rem;
    border-radius: 8px;
    letter-spacing: 0.08em;
}
.btn-mini.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; }
.btn-mini.outline {
    background: transparent;
    border: 1px solid var(--color-primary);
    color: var(--color-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.3rem;
}
.btn-mini.outline:hover { background: rgba(201,169,98,0.12); }

/* 页脚 */
.foot {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px dashed var(--glass-border);
    text-align: center;
    font-size: 0.78rem;
    color: var(--color-text-muted);
    letter-spacing: 0.2em;
}

/* 响应式 */
@media (max-width: 720px) {
    .stage { padding: 80px 14px 32px; }
    .card, .panel { padding: 18px; }
    .preview-box { aspect-ratio: 4 / 3; }
    .hud { padding: 0 14px; }
}
</style>
</head>
<body>

<!-- 左上角大尺寸返回按钮 -->
<a href="restoration-detail.html" class="back-btn" title="返回修复技术" aria-label="返回修复技术">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/>
        <path d="M12 19l-7-7 7-7"/>
    </svg>
    返回
</a>

<main class="stage">
    <div class="container">
        <header class="page-head">
            <span class="crumb">PATTERN · ATLAS</span>
            <h1>纹饰图鉴</h1>
            <p>典藏纹样 · 一键查阅 · 数字解读</p>
        </header>

        <div class="main-grid">
            <!-- 展示卡片 -->
            <section class="card">
                <div class="card-head">
                    <h2>纹饰展示</h2>
                    <span class="status-tag"><span class="status-dot"></span>READY</span>
                </div>

                <div class="preview-box" id="previewBox">
                    <span class="frame-corner tl"></span>
                    <span class="frame-corner tr"></span>
                    <span class="frame-corner bl"></span>
                    <span class="frame-corner br"></span>

                    <div class="preview-hint" id="previewHint">
                        <div class="hint-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h16v16H4z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </div>
                        <strong>纹饰图鉴</strong>
                        <p>选择下方任意纹饰，查看详细解读</p>
                    </div>

                    <div class="preview-art" id="previewArt" style="display:none;">
                        <img id="previewImg" src="" alt="纹饰">
                    </div>

                    <div class="preview-meta" id="previewMeta" style="display:none;">
                        <div class="name" id="previewName">—</div>
                        <div class="sub" id="previewSub">—</div>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn btn-primary" id="btnShow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
                        显示纹饰
                    </button>
                    <button class="btn btn-ghost" id="btnReset">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
                        重置
                    </button>
                </div>
            </section>

            <!-- 侧栏 -->
            <aside class="side">
                <div class="card panel">
                    <h3>纹饰目录</h3>
                    <p class="tip">点击下方任意纹饰，可直接在左侧预览并查看详细解读。</p>
                    <div class="chips" id="chipList">
                        <span class="chip" data-id="sanyangzun" data-img="images/artifact-fuhaozalianyan.jpg" data-name="四羊方尊" data-sub="商代晚期 · 盛酒礼器" data-conf="99.2" data-material="青铜" data-era="约 3000 年前" data-craft="范铸法" data-grade="国家一级" data-museum="中国国家博物馆">四羊方尊</span>
                        <span class="chip" data-id="jigu" data-img="images/artifact-drum-storyteller.jpg" data-name="击鼓说唱俑" data-sub="东汉 · 陶俑" data-conf="97.8" data-material="陶" data-era="约 1800 年前" data-craft="模制 + 彩绘" data-grade="国家一级" data-museum="故宫博物院">击鼓说唱俑</span>
                        <span class="chip" data-id="huniu" data-img="images/artifact-tiger-chunyu.jpg" data-name="虎钮淳于" data-sub="东汉 · 军乐器" data-conf="98.5" data-material="青铜" data-era="约 1800 年前" data-craft="范铸法" data-grade="国家一级" data-museum="三峡博物馆">虎钮淳于</span>
                        <span class="chip" data-id="niao" data-img="images/artifact-bronze-bird.jpg" data-name="青铜鸟" data-sub="商代 · 艺术摆件" data-conf="96.4" data-material="青铜" data-era="约 3000 年前" data-craft="范铸法" data-grade="国家二级" data-museum="上海博物馆">青铜鸟</span>
                        <span class="chip" data-id="ding" data-img="images/artifact-houmwu-ding.jpg" data-name="后母戊鼎" data-sub="商代 · 礼器" data-conf="98.9" data-material="青铜" data-era="约 3300 年前" data-craft="范铸法" data-grade="国家一级" data-museum="中国国家博物馆">后母戊鼎</span>
                    </div>
                </div>

                <div class="card panel detail" id="detailPanel">
                    <h3>详细信息</h3>
                    <div class="detail-head">
                        <span class="badge">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                            典藏
                        </span>

                            <div class="spec-grid">
                                <div><span>材质</span><span id="dMaterial">青铜</span></div>
                                <div><span>年代</span><span id="dEra">约 3000 年前</span></div>
                                <div><span>工艺</span><span id="dCraft">范铸法</span></div>
                                <div><span>级别</span><span id="dGrade">国家一级</span></div>
                                <div style="grid-column:1/-1;"><span>馆藏</span><span id="dMuseum">中国国家博物馆</span></div>
                            </div>

                                <a href="museum-3d.html" class="btn-mini btn-primary">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>

</main>

<script>
(function() {
    'use strict';

    const chips = document.querySelectorAll('.chip');
    const btnShow = document.getElementById('btnShow');
    const btnReset = document.getElementById('btnReset');
    const btnClose = document.getElementById('btnClose');
    const previewHint = document.getElementById('previewHint');
    const previewArt = document.getElementById('previewArt');
    const previewMeta = document.getElementById('previewMeta');
    const previewImg = document.getElementById('previewImg');
    const previewName = document.getElementById('previewName');
    const previewSub = document.getElementById('previewSub');
    const detailPanel = document.getElementById('detailPanel');
    const detailImg = document.getElementById('detailImg');
    const detailName = document.getElementById('detailName');
    const detailSub = document.getElementById('detailSub');
    const confVal = document.getElementById('confVal');
    const dMaterial = document.getElementById('dMaterial');
    const dEra = document.getElementById('dEra');
    const dCraft = document.getElementById('dCraft');
    const dGrade = document.getElementById('dGrade');
    const dMuseum = document.getElementById('dMuseum');

    let current = null;

    function getData(chip) {
        return {
            name: chip.dataset.name,
            sub: chip.dataset.sub,
            img: chip.dataset.img,
            conf: chip.dataset.conf,
            material: chip.dataset.material,
            era: chip.dataset.era,
            craft: chip.dataset.craft,
            grade: chip.dataset.grade,
            museum: chip.dataset.museum
        };
    }

    function show(chip) {
        const d = getData(chip);
        current = { ...d, id: chip.dataset.id };
        chips.forEach(c => c.classList.toggle('active', c === chip));

        previewHint.style.display = 'none';
        previewArt.style.display = 'flex';
        previewMeta.style.display = 'block';

        previewImg.src = d.img;
        previewImg.alt = d.name;
        previewName.textContent = d.name;
        previewSub.textContent = d.sub;

        detailImg.src = d.img;
        detailImg.alt = d.name;
        detailName.textContent = d.name;
        detailSub.textContent = d.sub;
        confVal.textContent = d.conf + '%';
        dMaterial.textContent = d.material;
        dEra.textContent = d.era;
        dCraft.textContent = d.craft;
        dGrade.textContent = d.grade;
        dMuseum.textContent = d.museum;

        detailPanel.classList.add('show');
    }

    function reset() {
        current = null;
        chips.forEach(c => c.classList.remove('active'));
        previewHint.style.display = '';
        previewArt.style.display = 'none';
        previewMeta.style.display = 'none';
        detailPanel.classList.remove('show');
    }

    chips.forEach(chip => {
        chip.addEventListener('click', () => show(chip));
    });

    btnShow.addEventListener('click', () => {
        if (current) {
            const chip = Array.from(chips).find(c => c.dataset.id === current.id);
            if (chip) show(chip);
            return;
        }
        if (chips.length) show(chips[0]);
    });

    btnReset.addEventListener('click', reset);
    btnClose.addEventListener('click', () => detailPanel.classList.remove('show'));

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (detailPanel.classList.contains('show')) detailPanel.classList.remove('show');
            else reset();
        }
    });
})();
</script>
