<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遗失详情 · 山河盼归 | 中华文物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #c9a962;
            --color-primary-dark: #8b7355;
            --color-bg-dark: #0a0a0f;
            --color-bg-medium: #12121a;
            --color-bg-light: #1a1a25;
            --glass-bg: rgba(20, 20, 30, 0.7);
            --glass-border: rgba(201, 169, 98, 0.15);
            --color-text: #f5f0e8;
            --color-text-muted: #8a8578;
            --font-display: 'Ma Shan Zheng', cursive;
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background: var(--color-bg-dark);
            color: var(--color-text);
            overflow-x: hidden;
            line-height: 1.8;
        }

        /* ============ 导航 ============ */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 1rem 2.5rem;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }
        .nav-back {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.5rem 1rem;
            color: var(--color-primary);
            text-decoration: none;
            font-family: var(--font-serif);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            border: 1px solid var(--color-primary);
            border-radius: 999px;
            background: rgba(201, 169, 98, 0.08);
            transition: all 0.3s ease;
        }
        .nav-back:hover {
            background: var(--color-primary);
            color: var(--color-bg-dark);
            transform: translateX(-2px);
        }
        .nav-logo {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--color-primary);
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        .nav-counter {
            color: var(--color-text-muted);
            font-family: var(--font-serif);
            font-size: 0.85rem;
            letter-spacing: 0.2em;
        }
        .nav-counter b {
            color: var(--color-primary);
            font-weight: 500;
        }

        /* ============ Hero ============ */
        .hero {
            position: relative;
            min-height: 70vh;
            padding: 7rem 2rem 4rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: brightness(0.4) saturate(1.1);
            z-index: 1;
        }
        .hero-bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg,
                rgba(10,10,15,0.5) 0%,
                rgba(10,10,15,0.7) 50%,
                rgba(10,10,15,0.98) 100%);
        }
        .hero-content {
            position: relative; z-index: 2;
            text-align: center; max-width: 800px;
        }
        .hero-eyebrow {
            display: inline-block;
            padding: 0.3rem 1rem;
            font-size: 0.72rem; letter-spacing: 0.4em;
            color: var(--color-primary);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            background: rgba(201, 169, 98, 0.06);
            margin-bottom: 1.4rem;
        }
        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 5vw, 3.8rem);
            color: var(--color-text);
            letter-spacing: 0.25em;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 40px rgba(201, 169, 98, 0.3);
        }
        .hero-era {
            font-family: var(--font-serif);
            font-size: 1.05rem;
            color: var(--color-text-muted);
            letter-spacing: 0.4em;
            margin-bottom: 0.4rem;
        }
        .hero-loc {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: var(--color-primary);
            letter-spacing: 0.3em;
        }

        /* ============ 主体两栏 ============ */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        /* ============ 遗失信息 ============ */
        .info-panel {
            padding: 2rem 0;
        }
        .info-section {
            margin-bottom: 2.5rem;
        }
        .info-h {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--color-primary);
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--glass-border);
            position: relative;
        }
        .info-h::before {
            content: ''; position: absolute;
            bottom: -1px; left: 0;
            width: 50px; height: 1px;
            background: var(--color-primary);
        }
        .info-text {
            font-family: var(--font-serif);
            font-size: 0.98rem;
            color: var(--color-text);
            line-height: 2;
            letter-spacing: 0.05em;
        }
        .info-text em {
            color: var(--color-primary);
            font-style: normal;
            font-weight: 500;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 1.5rem;
            margin-top: 1rem;
            padding: 1.4rem;
            background: rgba(201, 169, 98, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }
        .info-grid-item {
            display: flex; flex-direction: column; gap: 0.3rem;
        }
        .info-grid-label {
            font-family: var(--font-serif);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            letter-spacing: 0.2em;
        }
        .info-grid-value {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--color-primary);
            letter-spacing: 0.05em;
        }

        /* ============ 拼图游戏 ============ */
        .puzzle-panel {
            padding: 2rem 0;
        }
        .puzzle-header {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 1rem;
        }
        .puzzle-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: var(--color-primary);
            letter-spacing: 0.15em;
        }
        .puzzle-progress {
            font-family: var(--font-serif);
            font-size: 0.85rem;
            color: var(--color-text-muted);
            letter-spacing: 0.2em;
        }
        .puzzle-progress b {
            color: var(--color-primary);
            font-weight: 500;
        }
        .puzzle-board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            aspect-ratio: 1;
            width: 100%;
            padding: 4px;
            background: rgba(201, 169, 98, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }
        .puzzle-cell {
            position: relative;
            background: rgba(20, 20, 30, 0.6);
            border: 1px dashed rgba(201, 169, 98, 0.15);
            aspect-ratio: 1;
            overflow: hidden;
        }
        .puzzle-cell .hint-num {
            position: absolute; top: 4px; left: 4px;
            font-family: var(--font-serif);
            font-size: 0.7rem;
            color: var(--color-text-muted);
            opacity: 0.4;
            z-index: 2;
        }
        .puzzle-cell.occupied {
            border: 1px solid var(--color-primary);
            background: transparent;
        }
        .puzzle-piece {
            position: absolute;
            width: 100%; height: 100%;
            background-size: 400% 400%;
            background-repeat: no-repeat;
            cursor: grab;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            z-index: 5;
        }
        .puzzle-piece:hover { transform: scale(1.04); z-index: 10; }
        .puzzle-piece.dragging { cursor: grabbing; z-index: 20; }
        .puzzle-piece.placed { cursor: default; box-shadow: 0 0 0 2px var(--color-primary) inset; }
        .puzzle-tray {
            margin-top: 1rem;
            min-height: 90px;
            padding: 0.8rem;
            background: rgba(20, 20, 30, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            display: flex; flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
        }
        .puzzle-tray .puzzle-piece {
            position: relative;
            width: 60px; height: 60px;
            background-size: 400% 400%;
        }
        .puzzle-controls {
            display: flex; gap: 0.8rem; margin-top: 1rem;
        }
        .p-btn {
            flex: 1;
            padding: 0.8rem 1rem;
            font-family: var(--font-serif);
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            background: transparent;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .p-btn:hover { background: var(--color-primary); color: var(--color-bg-dark); }
        .p-btn.primary {
            background: linear-gradient(135deg, #d4a544 0%, #b8902f 100%);
            color: #1a1505;
            border-color: transparent;
        }
        .p-btn.primary:hover { background: linear-gradient(135deg, #e6b758 0%, #c89c34 100%); }

        /* ============ 完成模态 ============ */
        .puzzle-success {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .puzzle-success.active { opacity: 1; pointer-events: auto; }
        .success-card {
            text-align: center;
            padding: 3rem 4rem;
            background: linear-gradient(180deg, rgba(40, 30, 15, 0.9) 0%, rgba(20, 20, 30, 0.95) 100%);
            border: 1px solid var(--color-primary);
            box-shadow: 0 20px 60px rgba(201, 169, 98, 0.3);
            transform: scale(0.85);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-width: 420px;
        }
        .puzzle-success.active .success-card { transform: scale(1); }
        .success-icon {
            font-family: var(--font-display);
            font-size: 4rem;
            color: var(--color-primary);
            margin-bottom: 0.8rem;
        }
        .success-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--color-primary);
            letter-spacing: 0.2em;
            margin-bottom: 0.6rem;
        }
        .success-text {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            color: var(--color-text);
            letter-spacing: 0.1em;
            margin-bottom: 1.8rem;
            line-height: 1.8;
        }

        /* ============ 上下页导航 ============ */
        .pager {
            max-width: 1200px;
            margin: 2rem auto 5rem;
            padding: 0 2rem;
            display: flex; justify-content: space-between; gap: 1rem;
        }
        .pager a {
            flex: 1;
            padding: 1.5rem 1.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            text-decoration: none;
            color: var(--color-text);
            transition: all 0.3s ease;
            display: flex; flex-direction: column; gap: 0.4rem;
        }
        .pager a:hover {
            border-color: var(--color-primary);
            background: rgba(201, 169, 98, 0.08);
        }
        .pager .label {
            font-family: var(--font-serif);
            font-size: 0.78rem;
            color: var(--color-text-muted);
            letter-spacing: 0.2em;
        }
        .pager .name {
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--color-primary);
            letter-spacing: 0.1em;
        }
        .pager .empty { opacity: 0.3; pointer-events: none; }

        /* ============ Footer ============ */
        .footer {
            padding: 2.5rem 2rem; text-align: center;
            border-top: 1px solid var(--glass-border);
            background: var(--color-bg-dark);
        }
        .footer p {
            color: var(--color-text-muted);
            font-size: 0.85rem; letter-spacing: 0.2em;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 1024px) {
            .main { grid-template-columns: 1fr; gap: 2rem; }
        }
        @media (max-width: 768px) {
            .nav { padding: 0.8rem 1rem; }
            .hero { min-height: 60vh; padding: 6rem 1rem 3rem; }
            .puzzle-board { gap: 2px; }
            .puzzle-tray .puzzle-piece { width: 50px; height: 50px; }
        }
    </style>
</head>

    </main>

    <div class="pager">

    <script>

        const artifacts = [

                archive: [['年代', '北魏'], ['类别', '壁画 · 藻井'], ['材质', '矿物颜料 · 敦煌土'], ['尺寸', '约 120×120cm'], ['馆藏', '大英博物馆'], ['编号', 'OA 1919,0101,0.74']],

            {

                loss: '《女史箴图》原为清宫旧藏，<em>1900年八国联军侵华</em>时被英军从颐和园劫走，先入藏英王爱德华七世之手，后被大英博物馆以25英镑的价格购入。由于英国人不了解中国画的装裱传统，将原本的卷轴切割成四段，并以日式屏风形式重新装裱，造成画心断裂与磨损，是中国书画流散史上最痛心的一例。',

            {

                img: 'images/yishu-3.jpg',

            {

        // ============ 初始化 ============
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id') || '1');
        const idx = Math.max(0, Math.min(11, id - 1));
        const a = artifacts[idx];

        document.title = `${a.name} · 山河盼归 | 中华文物`;
        document.getElementById('heroBg').style.backgroundImage = `url('${a.img}')`;
        document.getElementById('heroTitle').textContent = a.name;
        document.getElementById('heroEra').textContent = a.era;
        document.getElementById('heroLoc').textContent = a.loc;
        document.getElementById('navNum').textContent = a.num;
        document.getElementById('lossText').innerHTML = a.loss;
        document.getElementById('returnText').innerHTML = a.return;

        const grid = document.getElementById('infoGrid');
        grid.innerHTML = a.archive.map(([k, v]) =>
            `<div class="info-grid-item">
                <span class="info-grid-label">${k}</span>
                <span class="info-grid-value">${v}</span>
            </div>`).join('');

        // 上下页
        const prev = document.getElementById('pPrev');
        const next = document.getElementById('pNext');
        if (idx === 0) {
            prev.classList.add('empty');
        } else {
            prev.href = `shanhe-detail.html?id=${idx}`;
            prev.querySelector('.name').textContent = artifacts[idx - 1].name;
        }
        if (idx === artifacts.length - 1) {
            next.classList.add('empty');
        } else {
            next.href = `shanhe-detail.html?id=${idx + 2}`;
            next.querySelector('.name').textContent = artifacts[idx + 1].name;
        }

        // ============ 拼图游戏 ============
        const SIZE = 4;
        let pieces = [];
        let cells = [];
        let placedCount = 0;
        let dragPiece = null;
        let offsetX = 0, offsetY = 0;
        let startX = 0, startY = 0;

        const board = document.getElementById('puzzleBoard');
        const tray = document.getElementById('puzzleTray');
        const pDone = document.getElementById('pDone');
        const pReset = document.getElementById('pReset');
        const pShuffle = document.getElementById('pShuffle');
        const pPreview = document.getElementById('pPreview');

        function buildBoard() {
            board.innerHTML = '';
            cells = [];
            for (let i = 0; i < SIZE * SIZE; i++) {
                const cell = document.createElement('div');
                cell.className = 'puzzle-cell';
                cell.dataset.idx = i;
                const hint = document.createElement('span');
                hint.className = 'hint-num';
                const r = Math.floor(i / SIZE) + 1;
                const c = (i % SIZE) + 1;
                hint.textContent = `${r},${c}`;
                cell.appendChild(hint);
                cell.addEventListener('dragover', e => e.preventDefault());
                cell.addEventListener('drop', e => {
                    e.preventDefault();
                    if (dragPiece) onDrop(cell);
                });
                board.appendChild(cell);
                cells.push(cell);
            }
        }

        function buildPieces() {
            pieces.forEach(p => p.el.remove());
            pieces = [];
            placedCount = 0;
            tray.innerHTML = '';
            for (let i = 0; i < SIZE * SIZE; i++) {
                const r = Math.floor(i / SIZE);
                const c = i % SIZE;
                const el = document.createElement('div');
                el.className = 'puzzle-piece';
                el.style.backgroundImage = `url('${a.img}')`;
                el.style.backgroundPosition = `${c * 100 / (SIZE - 1)}% ${r * 100 / (SIZE - 1)}%`;
                el.dataset.idx = i;
                el.draggable = true;
                el.addEventListener('dragstart', onDragStart);
                el.addEventListener('dragend', onDragEnd);
                // touch
                el.addEventListener('touchstart', onTouchStart, { passive: false });
                el.addEventListener('touchmove', onTouchMove, { passive: false });
                el.addEventListener('touchend', onTouchEnd);
                tray.appendChild(el);
                pieces.push({ idx: i, el, placed: false });
            }
            pDone.textContent = '0';
        }

        function onDragStart(e) {
            const p = pieces.find(x => x.el === e.target);
            if (!p || p.placed) { e.preventDefault(); return; }
            dragPiece = p;
            p.el.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(p.idx));
        }
        function onDragEnd() {
            if (dragPiece) dragPiece.el.classList.remove('dragging');
            dragPiece = null;
        }
        function onDrop(cell) {
            if (!dragPiece) return;
            const target = parseInt(cell.dataset.idx);
            if (target === dragPiece.idx) {
                placePiece(dragPiece, cell);
            } else {
                // 弹回
                dragPiece.el.style.transform = 'scale(1)';
            }
        }

        // 触摸支持
        let touchPiece = null;
        function onTouchStart(e) {
            const p = pieces.find(x => x.el === e.target);
            if (!p || p.placed) return;
            touchPiece = p;
            const t = e.touches[0];
            const rect = p.el.getBoundingClientRect();
            offsetX = t.clientX - rect.left;
            offsetY = t.clientY - rect.top;
            startX = rect.left; startY = rect.top;
            p.el.classList.add('dragging');
            document.body.style.overflow = 'hidden';
        }
        function onTouchMove(e) {
            if (!touchPiece) return;
            e.preventDefault();
            const t = e.touches[0];
            touchPiece.el.style.position = 'fixed';
            touchPiece.el.style.left = (t.clientX - offsetX) + 'px';
            touchPiece.el.style.top = (t.clientY - offsetY) + 'px';
            touchPiece.el.style.width = (board.offsetWidth / SIZE - 8) + 'px';
            touchPiece.el.style.height = (board.offsetWidth / SIZE - 8) + 'px';
        }
        function onTouchEnd(e) {
            if (!touchPiece) return;
            const t = e.changedTouches[0];
            // 找到落点
            let target = null;
            for (const cell of cells) {
                const rect = cell.getBoundingClientRect();
                if (t.clientX >= rect.left && t.clientX <= rect.right &&
                    t.clientY >= rect.top && t.clientY <= rect.bottom) {
                    target = cell; break;
                }
            }
            touchPiece.el.classList.remove('dragging');
            document.body.style.overflow = '';
            if (target && parseInt(target.dataset.idx) === touchPiece.idx) {
                placePiece(touchPiece, target);
            } else {
                // 重置
                touchPiece.el.style.position = '';
                touchPiece.el.style.left = '';
                touchPiece.el.style.top = '';
                touchPiece.el.style.width = '';
                touchPiece.el.style.height = '';
            }
            touchPiece = null;
        }

        function placePiece(p, cell) {
            if (cell.querySelector('.puzzle-piece')) return;
            p.placed = true;
            p.el.classList.add('placed');
            p.el.classList.remove('dragging');
            p.el.style.position = 'absolute';
            p.el.style.left = '0';
            p.el.style.top = '0';
            p.el.style.width = '100%';
            p.el.style.height = '100%';
            p.el.draggable = false;
            cell.appendChild(p.el);
            cell.classList.add('occupied');
            placedCount++;
            pDone.textContent = placedCount;
            if (placedCount === SIZE * SIZE) {
                setTimeout(showSuccess, 600);
            }
        }

        function showSuccess() {
            const s = document.getElementById('puzzleSuccess');
            document.getElementById('successText').textContent =
                `《${a.name}》归位完成 · 每一件游子都值得被记得`;
            s.classList.add('active');
        }

        document.getElementById('successClose').addEventListener('click', () => {
            document.getElementById('puzzleSuccess').classList.remove('active');
            shufflePieces();
        });

        function shufflePieces() {
            // 已放置的移除回托盘
            pieces.forEach(p => {
                if (p.placed) {
                    p.el.style.position = '';
                    p.el.style.left = '';
                    p.el.style.top = '';
                    p.el.style.width = '';
                    p.el.style.height = '';
                    p.el.draggable = true;
                    p.placed = false;
                }
            });
            cells.forEach(c => c.classList.remove('occupied'));
            cells.forEach(c => {
                const p = c.querySelector('.puzzle-piece');
                if (p) p.remove();
            });
            tray.innerHTML = '';
            // 重新随机顺序加入托盘
            const shuffled = [...pieces].sort(() => Math.random() - 0.5);
            shuffled.forEach(p => {
                p.el.classList.remove('placed');
                tray.appendChild(p.el);
            });
            placedCount = 0;
            pDone.textContent = '0';
        }

        pReset.addEventListener('click', buildPieces);
        pShuffle.addEventListener('click', shufflePieces);
        let previewing = false;
        pPreview.addEventListener('click', () => {
            if (previewing) {
                buildPieces();
                pPreview.textContent = '预 览';
                previewing = false;
            } else {
                tray.innerHTML = '';
                cells.forEach(c => c.classList.remove('occupied'));
                cells.forEach(c => {
                    const p = c.querySelector('.puzzle-piece');
                    if (p) p.remove();
                });
                pieces.forEach(p => {
                    p.el.classList.add('placed');
                    p.el.style.position = 'absolute';
                    p.el.style.left = '0';
                    p.el.style.top = '0';
                    p.el.style.width = '100%';
                    p.el.style.height = '100%';
                    p.el.draggable = false;
                    cells[p.idx].appendChild(p.el);
                    p.placed = true;
                });
                placedCount = SIZE * SIZE;
                pDone.textContent = placedCount;
                pPreview.textContent = '重 新 来 过';
                previewing = true;
            }
        });

        // 启动
        buildBoard();
        buildPieces();
    </script>
