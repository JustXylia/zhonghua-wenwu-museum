                { time: '明清之际', text: '历经战乱，副本大量散失。' },
                { time: '1860年与1900年', text: '英法联军与八国联军两度劫掠，副本再遭损失。' },
                { time: '20世纪', text: '陆续被各国图书馆与私人藏家收藏。' },

            ],
            story: [

            name: '洛神赋图 · 摹本',

            story: [

            modalText: '虎目圆睁三千年，<br>神徽不解异国言。'
        },
        'dunhuang-xiejing': {
            era: '唐代',
            name: '敦煌藏经洞写经',

            bg: 'images/shanhe-bg-6.jpg',
            now: '英 · 大英图书馆',
            timeline: [

            story: [
                '敦煌藏经洞是中国近代最痛心的文化损失之一。5 万件经卷与文书，被斯坦因用 40 块马蹄银、伯希和用 500 两白银，骗运出境。',

                '我们今天仍能看到它们——只是隔着万水千山，隔着"不列颠图书馆 OR.8210"的陌生编号。'

    // ========== 根据 URL 参数选择文物 ==========
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'kui-long-ding';
    const r = relics[id] || relics['kui-long-ding'];

    // 填充数据
    document.getElementById('relicEra').textContent = r.era;
    document.getElementById('relicName').textContent = r.name;
    document.getElementById('relicNow').innerHTML = '<b>现藏：</b>' + r.now;
    document.getElementById('relicImg').src = r.img;
    document.getElementById('relicImg').alt = r.name;
    document.getElementById('heroBg').style.backgroundImage = `url('${r.bg}')`;
    document.getElementById('modalText').innerHTML = r.modalText;
    document.title = r.name + ' · 山河盼归';

    // 渲染时间轴
    const tlList = document.getElementById('timelineList');
    tlList.innerHTML = r.timeline.map(t => `
        <li class="tl-item">
            <div class="tl-time">${t.time}</div>
            <div class="tl-text">${t.text}</div>
        </li>
    `).join('');

    // 渲染故事
    const story = document.getElementById('storyText');
    story.innerHTML = r.story.map(p => `<p>${p}</p>`).join('');

    // ========== 拼图游戏 ==========
    const SIZE = 4;
    const board = document.getElementById('puzzleBoard');
    const tray = document.getElementById('puzzleTray');
    const progressNum = document.getElementById('progressNum');
    const statusText = document.getElementById('statusText');
    const modal = document.getElementById('successModal');
    let placedCount = 0;
    let pieces = []; // { idx, placed: false, el }

    function buildBoard() {
        board.innerHTML = '';
        for (let i = 0; i < SIZE * SIZE; i++) {
            const cell = document.createElement('div');
            cell.className = 'puzzle-cell';
            cell.dataset.idx = i;
            const row = Math.floor(i / SIZE);
            const col = i % SIZE;
            cell.style.backgroundImage = `url('${r.img}')`;
            cell.style.backgroundPosition = `${(col / (SIZE - 1)) * 100}% ${(row / (SIZE - 1)) * 100}%`;
            cell.addEventListener('dragover', e => e.preventDefault());
            cell.addEventListener('drop', e => {
                e.preventDefault();
                const id = parseInt(e.dataTransfer.getData('text/plain'));
                tryPlace(id, i, cell);
            });
            cell.addEventListener('touchmove', e => {
                e.preventDefault();
            }, { passive: false });
            board.appendChild(cell);
        }
    }

    function buildPieces() {
        tray.innerHTML = '';
        pieces = [];
        // 洗牌
        const arr = Array.from({ length: SIZE * SIZE }, (_, i) => i);
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        for (const idx of arr) {
            const p = document.createElement('div');
            p.className = 'puzzle-piece';
            p.draggable = true;
            const row = Math.floor(idx / SIZE);
            const col = idx % SIZE;
            p.style.backgroundImage = `url('${r.img}')`;
            p.style.backgroundPosition = `${(col / (SIZE - 1)) * 100}% ${(row / (SIZE - 1)) * 100}%`;
            p.dataset.idx = idx;
            p.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', idx);
                p.classList.add('dragging');
            });
            p.addEventListener('dragend', () => p.classList.remove('dragging'));
            // 触摸支持
            let touchCell = null;
            p.addEventListener('touchstart', e => {
                e.preventDefault();
                p.classList.add('dragging');
            }, { passive: false });
            p.addEventListener('touchmove', e => {
                e.preventDefault();
                const t = e.touches[0];
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el && el.classList.contains('puzzle-cell')) {
                    if (touchCell !== el) {
                        if (touchCell) touchCell.style.boxShadow = '';
                        touchCell = el;
                        touchCell.style.boxShadow = 'inset 0 0 0 2px var(--gold)';
                    }
                } else if (touchCell) {
                    touchCell.style.boxShadow = '';
                    touchCell = null;
                }
            }, { passive: false });
            p.addEventListener('touchend', e => {
                e.preventDefault();
                p.classList.remove('dragging');
                if (touchCell) {
                    tryPlace(idx, parseInt(touchCell.dataset.idx), touchCell);
                    touchCell.style.boxShadow = '';
                    touchCell = null;
                }
            }, { passive: false });
            tray.appendChild(p);
            pieces.push({ idx, placed: false, el: p });
        }
    }

    function tryPlace(pieceIdx, cellIdx, cell) {
        if (pieceIdx === cellIdx) {
            // 正确
            const piece = pieces.find(p => p.idx === pieceIdx);
            if (piece && !piece.placed) {
                const row = Math.floor(pieceIdx / SIZE);
                const col = pieceIdx % SIZE;
                cell.classList.add('placed', 'correct-flash');
                cell.style.backgroundImage = `url('${r.img}')`;
                cell.style.backgroundPosition = `${(col / (SIZE - 1)) * 100}% ${(row / (SIZE - 1)) * 100}%`;
                cell.innerHTML = '';
                piece.placed = true;
                piece.el.style.opacity = '0.2';
                piece.el.style.pointerEvents = 'none';
                placedCount++;
                progressNum.textContent = placedCount;
                if (placedCount === SIZE * SIZE) {
                    statusText.textContent = '拼图完成 ✨';
                    setTimeout(() => modal.classList.add('show'), 600);
                } else {
                    statusText.textContent = '继续 · 越来越近';
                }
                setTimeout(() => cell.classList.remove('correct-flash'), 400);
            }
        } else {
            // 错误 - 抖动提示
            cell.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(-6px)' },
                { transform: 'translateX(6px)' },
                { transform: 'translateX(0)' }
            ], { duration: 200 });
        }
    }

    // 初始化
    buildBoard();
    buildPieces();
    placedCount = 0;
    progressNum.textContent = '0';
    statusText.textContent = '拖动拼图块到对应位置';

    // 按钮
    document.getElementById('resetBtn').addEventListener('click', () => {
        placedCount = 0;
        progressNum.textContent = '0';
        statusText.textContent = '拖动拼图块到对应位置';
        buildBoard();
        buildPieces();
    });
    document.getElementById('showBtn').addEventListener('click', () => {
        const img = document.getElementById('relicImg').cloneNode();
        img.style.cssText = 'width:90vw;max-width:600px;height:auto;border:1px solid var(--gold);';
        const wrap = document.createElement('div');
        wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:300;cursor:pointer;';
        wrap.appendChild(img);
        wrap.addEventListener('click', () => wrap.remove());
        document.body.appendChild(wrap);
    });
    document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', e => {
        if (e.target === modal) modal.classList.remove('show');
    });
</script>
