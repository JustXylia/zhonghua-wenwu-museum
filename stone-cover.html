<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>石之韵 · 中华文物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #0c0c0e;
            font-family: 'Noto Serif SC', serif;
            color: #f5f0e8;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(12,12,14,0.9) 0%, rgba(12,12,14,0) 100%);
        }
        .nav-logo {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.6rem;
            color: #c9a962;
            text-decoration: none;
            letter-spacing: 0.1em;
        }
        .nav-links {
            display: flex;
            gap: 2.2rem;
            list-style: none;
        }
        .nav-links a {
            color: rgba(245,240,232,0.55);
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
            position: relative;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #c9a962;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0;
            width: 0; height: 1px;
            background: #c9a962;
            transition: width 0.3s ease;
        }
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }
        .hero-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .hero-badge {
            display: inline-block;
            padding: 0.35rem 1.4rem;
            border: 1px solid rgba(201,169,98,0.4);
            border-radius: 50px;
            font-size: 0.82rem;
            color: #c9a962;
            letter-spacing: 0.2em;
            margin-bottom: 1.5rem;
            background: rgba(201,169,98,0.06);
            backdrop-filter: blur(8px);
        }
        .hero-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 7.5rem;
            color: #f5f0e8;
            text-shadow: 0 4px 40px rgba(0,0,0,0.7), 0 0 80px rgba(0,0,0,0.3);
            letter-spacing: 0.18em;
            line-height: 1.1;
        }
        .hero-subtitle {
            font-size: 1.35rem;
            color: #c9a962;
            margin-top: 1.2rem;
            letter-spacing: 0.35em;
            font-weight: 400;
        }
        .hero-desc {
            font-size: 1rem;
            color: rgba(245,240,232,0.55);
            margin-top: 1.5rem;
            max-width: 520px;
            line-height: 1.8;
        }
        .scroll-hint {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            color: rgba(245,240,232,0.35);
            font-size: 0.78rem;
            letter-spacing: 0.15em;
            animation: floatHint 2.5s ease-in-out infinite;
        }
        .scroll-hint-line {
            width: 1px;
            height: 36px;
            background: linear-gradient(to bottom, rgba(201,169,98,0.5), transparent);
        }
        @keyframes floatHint {
            0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.4; }
            50% { transform: translateX(-50%) translateY(-8px); opacity: 0.8; }
        }
        @media (max-width: 768px) {
            .hero-title { font-size: 4rem; }
            .hero-subtitle { font-size: 1rem; }
            .nav-links { display: none; }
            .nav { justify-content: center; }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    <div class="ui-layer">
        <nav class="nav">
            <a href="index.html" class="nav-logo">中华文物</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="vessels-cover.html">器之灵</a></li>
                <li><a href="stone-cover.html" class="active">石之韵</a></li>
                <li><a href="history-cover.html">史之痕</a></li>
                <li><a href="restoration-cover.html">文物修复</a></li>
                <li><a href="promotion-cover.html">推广</a></li>
            </ul>
        </nav>
        <div class="hero-text">
            <div class="hero-badge">石刻千秋</div>
            <h1 class="hero-title">石之韵</h1>
            <p class="hero-subtitle">石窟艺术 · 摩崖造像 · 石刻碑文</p>
            <p class="hero-desc">佛教传入中国后与本土文化融合，在崖壁上雕刻出千年不朽的艺术殿堂</p>
        </div>
        <div class="scroll-hint">
            <span>向下滚动</span>
            <div class="scroll-hint-line"></div>
        </div>
    </div>

    <script>
    (function() {
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // 配置
        const config = {
            sampleStep: 4,
            brightnessThreshold: 30,
            colors: [
                [139,125,100],[160,145,115],[120,110,88],
                [180,165,130],[100,92,75],[155,140,110],
                [90,82,68],[170,155,120]
            ],
            particleSizeMin: 1.2, particleSizeMax: 3.2,
            opacityMin: 0.25, opacityMax: 0.65,
            shape: 'dust',
            repelRadius: 200, repelStrength: 1.5,
            springStrength: 0.035, damping: 0.92,
            connectLines: true, connectDist: 28,
            lineColor: 'rgba(160,145,110,0.06)',
            bgColor: '#0c0c0e',
            driftSpeed: 0.3, driftAmp: 0.8
        };

        let particles = [];
        let mouse = { x: -9999, y: -9999, active: false };
        let clickWave = { x: 0, y: 0, radius: 0, active: false, strength: 0 };
        let time = 0;
        let imageLoaded = false;
        const img = new Image();
        img.src = 'images/hero-stone.jpg';
        img.crossOrigin = 'anonymous';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (imageLoaded) createParticles();
        }

        function createParticles() {
            const w = canvas.width;
            const h = canvas.height;
            const off = document.createElement('canvas');
            const offCtx = off.getContext('2d');
            off.width = w; off.height = h;

            const imgRatio = img.width / img.height;
            const canvasRatio = w / h;
            let drawW, drawH, drawX, drawY;
            if (imgRatio > canvasRatio) {
                drawH = h; drawW = h * imgRatio; drawX = (w - drawW) / 2; drawY = 0;
            } else {
                drawW = w; drawH = w / imgRatio; drawX = 0; drawY = (h - drawH) / 2;
            }
            offCtx.drawImage(img, drawX, drawY, drawW, drawH);

            const imageData = offCtx.getImageData(0, 0, w, h);
            const data = imageData.data;
            const step = config.sampleStep;

            particles = [];
            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2];
                    const brightness = (r + g + b) / 3;
                    if (brightness < config.brightnessThreshold || brightness > 245) continue;

                    const themeColor = config.colors[Math.floor(Math.random() * config.colors.length)];
                    const blend = 0.25 + Math.random() * 0.45;
                    const pr = Math.floor(themeColor[0] * blend + r * (1-blend));
                    const pg = Math.floor(themeColor[1] * blend + g * (1-blend));
                    const pb = Math.floor(themeColor[2] * blend + b * (1-blend));

                    particles.push({
                        ox: x, oy: y,
                        x: x + (Math.random()-0.5)*2,
                        y: y + (Math.random()-0.5)*2,
                        vx: 0, vy: 0,
                        r: pr, g: pg, b: pb,
                        size: config.particleSizeMin + Math.random() * (config.particleSizeMax - config.particleSizeMin),
                        opacity: config.opacityMin + Math.random() * (config.opacityMax - config.opacityMin),
                        phase: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.02,
                        rotation: Math.random() * Math.PI * 2,
                        aspectRatio: 0.3 + Math.random() * 0.7
                    });
                }
            }
        }

        img.onload = function() {
            imageLoaded = true;
            resize();
        };

        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });
        canvas.addEventListener('mouseleave', () => { mouse.active = false; });
        canvas.addEventListener('click', e => {
            const rect = canvas.getBoundingClientRect();
            clickWave.x = e.clientX - rect.left;
            clickWave.y = e.clientY - rect.top;
            clickWave.radius = 0;
            clickWave.active = true;
            clickWave.strength = 4;
        });

        function update() {
            time += 0.016;
            const mx = mouse.x, my = mouse.y;
            const repelR = config.repelRadius;
            const repelS = config.repelStrength;
            const spring = config.springStrength;
            const damping = config.damping;

            if (clickWave.active) {
                clickWave.radius += 12;
                clickWave.strength *= 0.96;
                if (clickWave.radius > 800 || clickWave.strength < 0.1) clickWave.active = false;
            }

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                const driftX = Math.sin(time * config.driftSpeed + p.phase) * config.driftAmp * 0.4;
                const driftY = Math.cos(time * config.driftSpeed * 0.7 + p.phase) * config.driftAmp * 0.25;

                const tx = p.ox + driftX;
                const ty = p.oy + driftY;

                p.vx += (tx - p.x) * spring;
                p.vy += (ty - p.y) * spring;

                if (mouse.active) {
                    const dx = p.x - mx;
                    const dy = p.y - my;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < repelR && dist > 1) {
                        const force = (1 - dist / repelR) * repelS;
                        p.vx += (dx / dist) * force;
                        p.vy += (dy / dist) * force;
                    }
                }

                if (clickWave.active) {
                    const dx = p.x - clickWave.x;
                    const dy = p.y - clickWave.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const waveW = 50;
                    if (Math.abs(dist - clickWave.radius) < waveW && dist > 1) {
                        const f = (1 - Math.abs(dist - clickWave.radius) / waveW) * clickWave.strength;
                        p.vx += (dx / dist) * f;
                        p.vy += (dy / dist) * f;
                    }
                }

                p.vx *= damping;
                p.vy *= damping;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
            }
        }

        function draw() {
            const w = canvas.width, h = canvas.height;
            ctx.fillStyle = config.bgColor;
            ctx.fillRect(0, 0, w, h);

            // 连线
            if (config.connectLines) {
                ctx.lineWidth = 0.4;
                const cd = config.connectDist;
                for (let i = 0; i < particles.length; i++) {
                    const p1 = particles[i];
                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p1.x - p2.x, dy = p1.y - p2.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < cd) {
                            ctx.globalAlpha = (1 - dist / cd) * 0.12;
                            ctx.strokeStyle = config.lineColor;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
            }

            // 粒子
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = p.opacity;
                ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
                const s = p.size;

                if (config.shape === 'dust') {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillRect(-s/2, -s*p.aspectRatio/2, s, s*p.aspectRatio);
                    ctx.restore();
                }
            }
            ctx.globalAlpha = 1;
        }

        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }

        animate();
    })();
    </script>
</body>
</html>
